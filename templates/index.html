<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cote Air Services</title>
    <style>
        /* 1. TYPOGRAPHY: Drop the soft generic fonts. Use hard monospace or retro system fonts */
        body {
            background-color: #0b0c10;
            color: #e4e6eb;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 40px 20px;
            line-height: 1.6;
        }

        /* 2. LAYOUT: Instead of a floating generic card, let's treat the page like a terminal terminal or minimalist log */
        .workspace {
            max-width: 650px;
            margin: 0 auto;
        }

        /* Raw headers with simple text punctuation instead of heavy neon styling */
        h1 {
            font-size: 1.5rem;
            color: #ffffff;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .subtitle {
            font-size: 0.85rem;
            color: #6272a4;
            margin-bottom: 30px;
        }

        /* 3. INPUTS: Raw borders, zero fancy rounded box-shadows or gradients */
        form {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 40px;
        }

        textarea {
            width: 100%;
            height: 110px;
            background-color: #121319;
            border: 2px solid #282a36;
            color: #f8f8f2;
            padding: 15px;
            box-sizing: border-box;
            resize: none;
            font-family: inherit;
            font-size: 0.95rem;
            outline: none;
        }

        /* Add a sharp, solid focus color rather than a soft blue glow */
        textarea:focus {
            border-color: #f1fa8c; /* Solid flat pale yellow */
        }

        /* 4. BUTTONS: Flat, blocky, styled like an old UI button or indie command menu */
        button {
            background-color: #282a36;
            color: #ffffff;
            border: 2px solid #44475a;
            padding: 12px;
            font-family: inherit;
            font-weight: bold;
            font-size: 0.9rem;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.15s ease;
            align-self: flex-start; /* Keeps it naturally sized, not a massive stretched bar */
        }

        button:hover {
            background-color: #f1fa8c;
            color: #282a36;
            border-color: #f1fa8c;
        }

        /* 5. CONTENT LOG: Organized like a timeline or real system log stream */
        .log-section {
            border-top: 2px dashed #282a36;
            padding-top: 30px;
        }

        .log-title {
            font-size: 0.9rem;
            color: #6272a4;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        .entry {
            background-color: #121319;
            border: 1px solid #1d2026;
            padding: 16px;
            margin-bottom: 12px;
            font-size: 0.95rem;
            position: relative;
        }
                
        .timestamp {
            font-size: 0.75rem;
            color: #6272a4;       
            margin-top: 6px;      
        }


        /* Put a precise time/index stamp look in the corner of every message */
        .entry::before {
            content: "• MSG_LOG //";
            font-size: 0.7rem;
            color: #6272a4;
            display: block;
            margin-bottom: 6px;
        }

        .empty-state {
            color: #44475a;
            font-style: italic;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <div class="workspace">
        <h1>Cote Air Services</h1>
        <div class="subtitle"></div>
        
        <form method="POST" action="/">
            <textarea name="user_message" placeholder="" required></textarea>
            <button type="submit">Send message</button>
        </form>

        <div class="log-section">
            <div class="log-title">Recent messages:</div>
            
            {% for msg in messages %}
                <div class="entry">
                    <div class="message-text">{{ msg.split('||')[0] }}</div>
                    <div class="timestamp">{{ msg.split('||')[1] }}</div>
                </div>

            {% else %}
                <div class="empty-state">[ No data written to messages.txt yet ]</div>
            {% endfor %}
        </div>
    </div>

</body>
</html>

    <!-- HTML goes here. It controls WHAT is on the page (text, images, links) -->

</body>
</html>
