<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGC Airfield Status</title>
    <link href="https://googleapis.com" rel="stylesheet">
    
    <style>
        /* =========================================================
           CUSTOMIZATION ZONE: EDIT FONTS, COLOURS & POSITION HERE
           ========================================================= */
        :root {
            --main-font: 'Montserrat', sans-serif;
            --card-bg-color: rgba(15, 23, 42, 0.82); /* Dark navy, 82% opaque */
            --text-color: #ffffff;
            --subtext-color: #cbd5e1;
        }

        body {
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            font-family: var(--main-font);
            color: var(--text-color);

            /* BACKGROUND IMAGE SETTINGS */
            background-image: url("{{ url_for(filename='background.jpg') }}");
            background-size: cover;       /* Zooms slightly to fill entire screen */
            background-position: center;  /* Keeps the glider centered */
            background-repeat: no-repeat;
            background-attachment: fixed;

            /* POSITIONING OF THE STATUS BOX ON SCREEN */
            display: flex;
            justify-content: center;      /* Left: flex-start | Center: center | Right: flex-end */
            align-items: center;          /* Top: flex-start  | Center: center | Bottom: flex-end */
            box-sizing: border-box;
        }

        .status-card {
            background-color: var(--card-bg-color);
            backdrop-filter: blur(8px);
            padding: 40px 30px;
            border-radius: 16px;
            max-width: 550px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            border-top: 8px solid {{ state.color }};
        }

        .club-name {
            font-size: 0.9rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--subtext-color);
            margin-bottom: 15px;
            font-weight: 700;
        }

        .status-badge {
            background-color: {{ state.color }};
            color: #ffffff;
            font-size: 1.5rem;
            font-weight: 900;
            padding: 15px 25px;
            border-radius: 8px;
            display: inline-block;
            margin: 10px 0 20px 0;
            letter-spacing: 1px;
        }

        .status-message {
            font-size: 1.1rem;
            line-height: 1.6;
            color: var(--text-color);
            margin: 0 0 20px 0;
        }

        /* HIDDEN ADMIN PANEL STYLES */
        .toggle-btn {
            background: none;
            border: none;
            color: var(--subtext-color);
            font-family: var(--main-font);
            font-size: 0.75rem;
            cursor: pointer;
            opacity: 0.6;
            text-decoration: underline;
        }
        .toggle-btn:hover { opacity: 1; }

        .admin-drawer {
            display: {% if error %}block{% else %}none{% endif %};
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.15);
            text-align: left;
        }

        .admin-drawer label {
            display: block;
            font-size: 0.8rem;
            font-weight: 700;
            margin: 12px 0 5px 0;
            color: var(--subtext-color);
        }

        .admin-drawer select, 
        .admin-drawer textarea, 
        .admin-drawer input {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: none;
            font-family: var(--main-font);
            font-size: 0.9rem;
            box-sizing: border-box;
        }

        .submit-btn {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            background-color: #2563eb;
            color: white;
            font-family: var(--main-font);
            font-weight: 700;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
        .submit-btn:hover { background-color: #1d4ed8; }

        .error-msg {
            color: #f87171;
            font-size: 0.85rem;
            font-weight: 700;
            margin-bottom: 10px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="status-card">
        <div class="club-name">Southdown Gliding Club • Parham Airfield</div>
        
        <div class="status-badge">
            {{ state.status }}
        </div>
        
        <p class="status-message">
            {{ state.message }}
        </p>

        <!-- Discreet button to open the password updater -->
        <button class="toggle-btn" onclick="toggleAdmin()">Duty Instructor Update</button>

        <!-- Hidden Password-Protected Update Form -->
        <div id="adminPanel" class="admin-drawer">
            {% if error %}
                <div class="error-msg">{{ error }}</div>
            {% endif %}

            <form method="POST">
                <label>Select Airfield Status</label>
                <select name="status_choice">
                    <option value="open">OPEN - Normal Operations (Green)</option>
                    <option value="delayed">STANDBY - May Open Later (Amber)</option>
                    <option value="restricted">OPEN - Restricted / Solo Only (Blue)</option>
                    <option value="closed">CLOSED - No Flying (Red)</option>
                </select>

                <label>Daily Briefing / Notes</label>
                <textarea name="message" rows="2">{{ state.message }}</textarea>

                <label>Instructor Password</label>
                <input type="password" name="password" placeholder="Enter password..." required>

                <button type="submit" class="submit-btn">Publish Live Update</button>
            </form>
        </div>
    </div>

    <script>
        function toggleAdmin() {
            var panel = document.getElementById("adminPanel");
            panel.style.display = (panel.style.display === "none" || panel.style.display === "") ? "block" : "none";
        }
    </script>

</body>
</html>
