<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Southdown Gliding Club - Airfield Status</title>
    <!-- Google Font Import (Change 'Montserrat' here to try other fonts) -->
    <link href="https://googleapis.com" rel="stylesheet">
    
    <style>
        /* =========================================================
           CUSTOMIZATION ZONE: EDIT FONTS, COLOURS & POSITION HERE
           ========================================================= */
        :root {
            --main-font: 'Montserrat', sans-serif;
            --card-bg-color: rgba(15, 23, 42, 0.80); /* Dark navy, 80% opaque */
            --text-color: #ffffff;
            --subtext-color: #cbd5e1;
        }

        body {
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            font-family: var(--main-font);
            color: var(--text-color);

            /* BACKGROUND IMAGE SETTINGS */
            background-image: url("{{ url_for('static', filename='background.jpg') }}");
            background-size: cover;       /* Zooms slightly to fill entire screen */
            background-position: center;  /* Keeps the glider centered */
            background-repeat: no-repeat;
            background-attachment: fixed;

            /* POSITIONING OF THE STATUS BOX ON SCREEN */
            display: flex;
            justify-content: center;      /* Horizontal: 'flex-start' (left), 'center', 'flex-end' (right) */
            align-items: center;          /* Vertical: 'flex-start' (top), 'center', 'flex-end' (bottom) */
            box-sizing: border-box;
        }

        .status-card {
            background-color: var(--card-bg-color);
            backdrop-filter: blur(8px);   /* Frosted glass blur effect */
            padding: 40px 30px;
            border-radius: 16px;
            max-width: 550px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            border-top: 8px solid {{ state.color }};
        }

        .club-name {
            font-size: 0.9rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--subtext-color);
            margin-bottom: 15px;
            font-weight: 700;
        }

        .status-badge {
            background-color: {{ state.color }};
            color: #ffffff;
            font-size: 1.6rem;
            font-weight: 900;
            padding: 15px 25px;
            border-radius: 8px;
            display: inline-block;
            margin: 10px 0 20px 0;
            letter-spacing: 1px;
        }

        .status-message {
            font-size: 1.1rem;
            line-height: 1.6;
            color: var(--text-color);
            margin: 0 0 25px 0;
        }

        .admin-link {
            font-size: 0.75rem;
            color: var(--subtext-color);
            text-decoration: none;
            opacity: 0.6;
        }
        .admin-link:hover { opacity: 1; }
    </style>
</head>
<body>

    <div class="status-card">
        <div class="club-name">Southdown Gliding Club • Parham Airfield</div>
        
        <div class="status-badge">
            {{ state.status }}
        </div>
        
        <p class="status-message">
            {{ state.message }}
        </p>

        <a href="/admin" class="admin-link">Duty Instructor Login</a>
    </div>

</body>
</html>
